[package]
name = "spatial-io"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Primitive-neutral spatial conversion and geospatial artifact I/O"
repository = "https://github.com/vycorporation/spatial-io-rs"
readme = "README.md"
keywords = ["geospatial", "geoparquet", "geotiff", "bezier", "geometry"]
categories = ["science::geo", "graphics"]

[features]
default = []
geotiff = ["dep:geotiff-core", "dep:geotiff-reader"]
geoparquet = [
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:epsg-utils",
    "dep:geo-types",
    "dep:geoparquet",
    "dep:hex",
    "dep:parquet",
    "dep:sha2",
    "dep:tempfile",
    "dep:wkb",
]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

arrow-array = { version = "58.0.0", optional = true }
arrow-schema = { version = "58.0.0", optional = true }
epsg-utils = { version = "=0.0.3", default-features = false, features = ["projjson-definitions"], optional = true }
geo-types = { version = "0.7.19", optional = true }
geoparquet = { version = "0.8.0", optional = true }
geotiff-core = { version = "=0.7.0", optional = true }
geotiff-reader = { version = "=0.7.0", default-features = false, features = ["local"], optional = true }
hex = { version = "0.4.3", optional = true }
parquet = { version = "58.0.0", default-features = false, features = ["arrow", "snap"], optional = true }
sha2 = { version = "0.10.9", optional = true }
tempfile = { version = "3.23.0", optional = true }
wkb = { version = "0.9.2", optional = true }

[dev-dependencies]
geotiff-writer = "=0.7.0"
ndarray = "0.17.1"
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
